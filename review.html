<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Google口コミを開いています</title>
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
    main{text-align:center;padding:32px}.spinner{width:38px;height:38px;margin:0 auto 18px;border:4px solid #ddd;border-top-color:#4285f4;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
    a{color:#1769d2}
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <p>Google口コミ画面を開いています…</p>
    <p><a id="reviewLink" href="#">開かない場合はこちら</a></p>
  </main>
  <script>
    const target = 'https://www.google.com/search?q=senn+%E5%90%8D%E5%8F%A4%E5%B1%8B%E5%B8%82+%E3%83%AC%E3%83%93%E3%83%A5%E3%83%BC#lrd=0x6003753edd2f0e0d:0xe3e5dbed38f585b,3,,,,';
    document.getElementById('reviewLink').href = target;
    setTimeout(() => location.replace(target), 150);
  </script>
</body>
</html>
