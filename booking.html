<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SENN 予約</title>
<style>
  :root {
    --bg: #efefea; --surface: #ffffff; --sunken: #e4e2db; --sunken-line: #d0cdc2;
    --text: #26251f; --text-muted: #85837a; --border: #d6d3c9;
    --accent: #a9895a; --accent-text: #2a1f0f;
    --good: #4f6a58; --good-bg: #e4ebe4; --good-border: #b9ccb9;
    --warn: #a24f34; --warn-bg: #f3e3dc; --warn-border: #ddb7a5;
    --radius: 10px; --shadow: 0 1px 2px rgba(38,37,31,0.06), 0 4px 14px rgba(38,37,31,0.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  .tabular { font-variant-numeric: tabular-nums; }
  .page { max-width: 520px; margin: 0 auto; padding: 0 0 32px; display: flex; flex-direction: column; background: var(--surface); }
  footer.bottom { padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
  footer.bottom .hours { font-size: 12.5px; color: var(--text-muted); }
  footer.bottom .brand-mark { font-size: 11px; letter-spacing: 0.16em; color: var(--sunken-line); text-transform: uppercase; font-weight: 700; }
  header.top { padding: 14px 16px 12px; background: var(--surface); }
  header.top .brand { font-size: 13px; letter-spacing: 0.14em; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
  header.top h1 { font-size: 18px; margin: 2px 0 0; font-weight: 700; }
  section.card { background: var(--surface); border: none; border-top: 8px solid var(--bg); border-radius: 0; box-shadow: none; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-muted); flex: 1; }
  input, select, textarea {
    font: inherit; font-size: 16px; color: var(--text); background: var(--sunken);
    border: 1px solid var(--sunken-line); border-radius: 7px; padding: 9px 10px; width: 100%;
  }
  textarea { resize: vertical; min-height: 64px; }
  .day-picker { display: flex; flex-direction: column; gap: 16px; }
  .cal-month-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 10.5px; color: var(--text-muted); font-weight: 600; padding-bottom: 3px; }
  .cal-cell { position: relative; aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 8px; background: var(--sunken); border: 1px solid transparent; cursor: pointer; }
  .cal-cell.empty, .cal-cell.disabled { background: transparent; cursor: default; }
  .cal-cell.disabled .d { color: var(--sunken-line); }
  .cal-cell .d { font-size: 13.5px; font-weight: 700; color: var(--text); }
  .cal-cell .mark { font-size: 11px; font-weight: 800; line-height: 1; }
  .cal-cell.status-open .mark { color: var(--good); }
  .cal-cell.status-few .mark { color: var(--accent); }
  .cal-cell.status-full .mark { color: var(--warn); }
  .cal-cell.status-full { opacity: 0.6; }
  .cal-cell.status-closed .d { color: var(--text-muted); }
  .cal-cell.status-closed .mark { color: var(--text-muted); }
  .cal-cell.status-closed { opacity: 0.55; }
  .cal-cell.status-syncing { opacity: 0.65; }
  .cal-cell.status-syncing .mark { color: var(--text-muted); }
  .cal-cell.active { background: var(--accent); border-color: var(--accent); }
  .cal-cell.active .d { color: var(--accent-text); }
  .cal-cell.active .mark { color: var(--accent-text); }
  .day-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .day-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .day-legend b { font-size: 12px; }
  .day-legend b.mk-open { color: var(--good); }
  .day-legend b.mk-few { color: var(--accent); }
  .day-legend b.mk-full { color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--sunken); color: var(--text); border-radius: 999px; padding: 8px 13px; font-size: 13.5px; cursor: pointer; user-select: none; }
  .chip input { display: none; }
  .chip .dur { color: var(--text-muted); font-size: 12px; }
  .chip.checked { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip.checked .dur { color: var(--accent-text); opacity: 0.75; }
  .duration-readout { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); }
  .duration-readout strong { color: var(--text); font-size: 15px; }
  button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid transparent; }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 15px; padding: 13px 16px; border: none; width: 100%; }
  button.primary:disabled { opacity: 0.5; }
  button.secondary { background: var(--sunken); color: var(--text); border: 1px solid var(--sunken-line); font-weight: 600; font-size: 14px; padding: 12px 16px; width: 100%; }
  .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot-btn { padding: 12px 6px; border-radius: 8px; text-align: center; font-size: 14.5px; font-weight: 700; border: 1.5px solid var(--good-border); background: var(--good-bg); color: var(--good); cursor: pointer; }
  .slot-btn.best { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--good-bg)); color: var(--text); }
  .slot-btn.selected { outline: 2px solid var(--text); }
  .slot-btn .tag { display:block; font-size: 10px; font-weight: 700; margin-top: 2px; opacity: 0.75; }
  .status-hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 16px; border-radius: var(--radius); text-align: center; }
  .status-hero.ok { background: var(--good-bg); border: 1px solid var(--good-border); }
  .status-hero.ng { background: var(--warn-bg); border: 1px solid var(--warn-border); }
  .status-hero .mark { font-size: 30px; line-height: 1; }
  .status-hero.ok .mark { color: var(--good); }
  .status-hero.ng .mark { color: var(--warn); }
  .status-hero .msg { font-size: 14.5px; font-weight: 700; color: var(--text); }
  .status-hero .sub { font-size: 12.5px; color: var(--text-muted); }
  .recommend-banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--good-border); background: var(--good-bg); }
  .recommend-banner .icon { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
  .recommend-banner .body .title { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
  .recommend-banner .body .menu { font-size: 15px; font-weight: 800; color: var(--text); }
  .empty-note { font-size: 13.5px; color: var(--text-muted); padding: 6px 2px; }
  .loading { text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">SENN</div>
    <h1>ご予約</h1>
  </header>

  <section class="card" id="recommendCard" style="display:none;"></section>

  <section class="card">
    <div class="eyebrow">1. ご希望のメニューを選ぶ</div>
    <div class="empty-note">メニューを選ぶと、その施術時間で予約できる日が表示されます。</div>
    <div class="chips" id="menuChips"></div>
    <div class="duration-readout"><span>合計時間</span><strong class="tabular" id="durationReadout">0分</strong></div>
  </section>

  <section class="card">
    <div class="eyebrow">2. 日付を選ぶ</div>
    <div class="day-picker" id="dayPicker"></div>
    <div class="day-legend" id="dayLegend" style="display:none;">
      <span><b class="mk-open">○</b>空きあり</span>
      <span><b class="mk-few">△</b>残りわずか</span>
      <span><b class="mk-full">×</b>満席</span>
    </div>
  </section>

  <section class="card">
    <div class="eyebrow">3. 空いている時間を表示・選択する</div>
    <label class="field">ご要望・コメント（任意）
      <textarea id="comment" placeholder="例：パーマが必要であればお願いしたいです"></textarea>
    </label>
    <button class="primary" id="checkBtn">空いている時間を表示する</button>
  </section>

  <section class="card" id="resultSection" style="display:none;"></section>

  <footer class="bottom">
    <div class="hours">営業時間 火〜日 9:00〜19:30（月曜定休）</div>
    <div class="brand-mark">SENN</div>
  </footer>

  <div id="debugBox" style="font-size:11px; color:#999; padding:8px; word-break:break-all;"></div>
</div>

<script>window.LIFF_ID = "2011000948-g2fSsa55";</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  var settings = null;
  var selectedDateKey = null;
  var selectedMenu = new Set();
  var lineProfile = null;
  var selectedSlot = null;
  var dates = [];
  var daySummary = {};
  var summaryCache = {};
  var availabilityCache = {};
  var availabilityPending = {};
  var summaryRequestId = 0;

  var DOW = ["日","月","火","水","木","金","土"];
var API_BASE = "https://script.google.com/macros/s/AKfycbxptPE5Z0ajsSiAXfyCoPHHGeaykmFgxM1QF9UVEWCQkut9pO5kf3by725b5AMG8OP3/exec";
  var FALLBACK_SETTINGS = {
    openTime: '09:00', closeTime: '19:30', closedDow: '月', step: 30,
    windowStart: 0, windowEnd: 45,
    menu: [
      {name:'カット',min:60}, {name:'カラー',min:60}, {name:'パーマ',min:120},
      {name:'ストレート',min:210}, {name:'トリートメント',min:20},
      {name:'ヘッドスパ',min:20}, {name:'ブリーチ',min:180}
    ]
  };

  function apiGet(action, params, cb, onError) {
    var qs = 'action=' + encodeURIComponent(action);
    for (var k in params) {
      if (params[k] !== null && params[k] !== undefined) qs += '&' + k + '=' + encodeURIComponent(params[k]);
    }
    fetch(API_BASE + '?' + qs)
      .then(function (r) { return r.json(); })
      .then(cb)
      .catch(function (err) {
        debugLog('apiGet error(' + action + '): ' + err);
        if (onError) onError(err);
      });
  }

  function apiPost(payload, onSuccess, onError) {
    fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(onSuccess)
      .catch(onError);
  }

  function sendBookingToOfficialChat(payload, result) {
    return Promise.resolve().then(function () {
    if (typeof liff === 'undefined' || !liff.isInClient || !liff.isInClient() || !liff.sendMessages) {
      return { sent: false, code: 'outside_liff' };
    }
    var context = liff.getContext ? liff.getContext() : null;
    if (!context || context.type !== 'utou') {
      return { sent: false, code: 'no_chat_context' };
    }
    if (context.scope && context.scope.indexOf('chat_message.write') === -1) {
      return { sent: false, code: 'missing_chat_scope' };
    }
    return Promise.resolve().then(function () {
      return liff.sendMessages([{ type: 'text', text: bookingChatText(payload, result) }]);
    }).then(function () { return { sent: true }; });
    })
      .catch(function (err) {
        var code = String((err && err.code) || 'send_failed').replace(/[^a-zA-Z0-9_.-]/g, '').slice(0, 80);
        debugLog('公式LINEチャット送信エラー: ' + code);
        return { sent: false, code: code };
      });
  }

  function bookingChatText(payload, result) {
    return [
      '【予約リクエスト】',
      'お名前：' + (payload.name || ''),
      '日時：' + payload.date + ' ' + result.startHHMM + '〜' + result.endHHMM,
      'メニュー：' + (payload.menuNames || []).join('＋'),
      payload.phone ? '電話番号：' + payload.phone : '',
      payload.comment ? 'コメント：' + payload.comment : '',
      result.id ? '受付番号：' + result.id : ''
    ].filter(Boolean).join('\n');
  }

  function finishOfficialChat(payload, result) {
    var note = document.getElementById('submitNote');
    note.style.display = 'block';
    note.textContent = '予約リクエストは保存済みです。公式LINEに予約内容を送信しています…';
    var waitingTimer = setTimeout(function () {
      note.textContent = '予約リクエストは保存済みです。公式LINEへの送信結果をまだ確認できません。予約を再登録する必要はありません。';
      var link = document.createElement('a');
      link.href = 'https://line.me/R/oaMessage/%40576filin/?' + encodeURIComponent(bookingChatText(payload, result));
      link.textContent = '公式LINEのトークで送信状況を確認する';
      link.style.cssText = 'display:block;padding:14px 0;text-decoration:underline;font-weight:700';
      note.appendChild(link);
      var help = document.createElement('p');
      help.textContent = '同じ受付番号のメッセージが届いていなければ、入力済みの予約内容を送信してください。';
      note.appendChild(help);
    }, 12000);
    sendBookingToOfficialChat(payload, result).then(function (delivery) {
      clearTimeout(waitingTimer);
      if (result.chatReceipt) {
        apiPost({ action: 'reportBookingChat', id: result.id, chatReceipt: result.chatReceipt,
          status: delivery.sent ? 'sent' : 'failed', code: delivery.code || '' },
          function (r) { if (!r.ok) debugLog('送信結果の記録に失敗'); },
          function () { debugLog('送信結果の記録は未確認'); });
      }
      note.textContent = 'ご予約リクエストを受け付けました（' + result.startHHMM + '〜' + result.endHHMM + '）。内容を確認のうえ、改めて確定のご連絡をいたします。';
      if (delivery.sent) return;
      var warning = document.createElement('p');
      warning.textContent = '予約は保存されていますが、公式LINEのトークには送信できませんでした。下のボタンから予約内容をお送りください。予約の再登録は不要です。';
      note.appendChild(warning);
      var retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'secondary';
      retry.textContent = '公式LINEへの送信を再試行';
      retry.addEventListener('click', function () { finishOfficialChat(payload, result); });
      note.appendChild(retry);
      var link = document.createElement('a');
      link.href = 'https://line.me/R/oaMessage/%40576filin/?' + encodeURIComponent(bookingChatText(payload, result));
      link.textContent = '予約内容を入れて公式LINEを開く';
      link.style.cssText = 'display:block;padding:14px 0;text-decoration:underline;font-weight:700';
      note.appendChild(link);
      var help = document.createElement('p');
      help.textContent = 'トークが開いたら、入力済みの予約内容を送信してください。';
      note.appendChild(help);
    });
  }

  function availabilityKey(date, duration) {
    return date + ':' + duration;
  }

  function prefetchAvailability(date, duration, cb) {
    if (!date || !duration) return;
    var key = availabilityKey(date, duration);
    if (availabilityCache[key]) {
      if (cb) cb(availabilityCache[key]);
      return;
    }
    if (cb) {
      if (!availabilityPending[key]) availabilityPending[key] = [];
      availabilityPending[key].push(cb);
    }
    if (availabilityPending[key] && availabilityPending[key].loading) return;
    if (!availabilityPending[key]) availabilityPending[key] = [];
    availabilityPending[key].loading = true;
    apiGet('availability', { date: date, duration: duration }, function (res) {
      availabilityCache[key] = res;
      var callbacks = availabilityPending[key] || [];
      delete availabilityPending[key];
      callbacks.forEach(function (fn) { fn(res); });
    }, function () {
      delete availabilityPending[key];
    });
  }

  function prefetchSummary(duration, cb) {
    if (summaryCache[duration]) {
      if (cb) cb(summaryCache[duration]);
      return;
    }
    apiGet('availabilitySummary', { duration: duration }, function (res) {
      summaryCache[duration] = res;
      if (cb) cb(res);
    });
  }

  function dateKey(d) {
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function fmtDur(min) {
    if (min <= 0) return "0分";
    var h = Math.floor(min/60), m = min%60;
    if (h===0) return m+"分";
    if (m===0) return h+"時間";
    return h+"時間"+m+"分";
  }

  function debugLog(msg) {
    var box = document.getElementById('debugBox');
    if (box) box.textContent += msg + ' / ';
  }

  function init() {
    debugLog('LIFF_ID=' + window.LIFF_ID);
    debugLog('liffLoaded=' + (typeof liff !== 'undefined'));
    if (typeof liff !== 'undefined' && window.LIFF_ID) {
      try {
        debugLog('liff.init呼び出し直前');
        var initResult = liff.init({ liffId: window.LIFF_ID });
        debugLog('liff.init呼び出し直後 type=' + typeof initResult);
        initResult.then(function () {
          debugLog('liff.init OK');
          debugLog('isLoggedIn=' + liff.isLoggedIn());
          debugLog('isInClient=' + liff.isInClient());
          if (liff.isLoggedIn()) {
            liff.getProfile().then(function (profile) {
              debugLog('profile取得OK: ' + profile.displayName);
              lineProfile = profile;
              var nameInput = document.getElementById('custName');
              if (nameInput) nameInput.value = profile.displayName;
              apiGet('recommendation', { userId: profile.userId }, renderRecommend);
            }).catch(function(err){ debugLog('getProfile error: ' + JSON.stringify(err)); });
          } else {
            debugLog('未ログイン状態。liff.login()を試みます');
            liff.login();
          }
        }).catch(function (err) { debugLog('LIFF init error(async): ' + JSON.stringify(err)); });
      } catch (syncErr) {
        debugLog('LIFF init 同期エラー: ' + syncErr.message);
      }
    } else {
      debugLog('LIFF初期化スキップ（LIFF_IDまたはSDK未読込）');
    }
    // APIの応答を待たず、日付とメニューをすぐ操作できる状態にする。
    onSettingsLoaded(FALLBACK_SETTINGS);
    prefetchSummary(60);
    prefetchAvailability(selectedDateKey, 60);
    apiGet('settings', {}, onSettingsLoaded, function () {
      debugLog('基本設定は予備データで表示中');
    });
  }

  function onSettingsLoaded(s) {
    if (!s || !Array.isArray(s.menu) || s.menu.length === 0) return;
    settings = s;
    var today = new Date();
    dates = [];
    for (var i = 0; i <= 45; i++) {
      var d = new Date(); d.setDate(today.getDate()+i);
      dates.push(d);
    }
    if (!selectedDateKey) selectedDateKey = dateKey(dates[0]);
    renderDayPicker();
    renderMenuChips();
  }

  function markForStatus_(status) {
    if (status === 'open') return '○';
    if (status === 'few') return '△';
    if (status === 'full') return '×';
    if (status === 'closed') return '休';
    if (status === 'syncing') return '確認中';
    return '';
  }

  function renderDayPicker() {
    var wrap = document.getElementById('dayPicker');
    wrap.innerHTML = '';

    var byMonth = {};
    var monthOrder = [];
    dates.forEach(function (d) {
      var mk = d.getFullYear() + '-' + d.getMonth();
      if (!byMonth[mk]) {
        byMonth[mk] = { year: d.getFullYear(), month: d.getMonth(), days: {} };
        monthOrder.push(mk);
      }
      byMonth[mk].days[d.getDate()] = d;
    });

    monthOrder.forEach(function (mk) {
      var m = byMonth[mk];
      var lastDay = new Date(m.year, m.month + 1, 0).getDate();
      var firstDow = new Date(m.year, m.month, 1).getDay();

      var monthDiv = document.createElement('div');
      var title = document.createElement('div');
      title.className = 'cal-month-title';
      title.textContent = m.year + '年' + (m.month + 1) + '月';
      monthDiv.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'cal-grid';
      DOW.forEach(function (w) {
        var el = document.createElement('div');
        el.className = 'cal-dow';
        el.textContent = w;
        grid.appendChild(el);
      });
      for (var i = 0; i < firstDow; i++) {
        var pad = document.createElement('div');
        pad.className = 'cal-cell empty';
        grid.appendChild(pad);
      }
      for (var day = 1; day <= lastDay; day++) {
        var dObj = m.days[day];
        var cell = document.createElement('div');
        if (!dObj) {
          cell.className = 'cal-cell disabled';
          cell.innerHTML = '<span class="d">' + day + '</span>';
          grid.appendChild(cell);
          continue;
        }
        var key = dateKey(dObj);
        var status = daySummary[key];
        var mark = markForStatus_(status);
        cell.className = 'cal-cell' + (status ? ' status-' + status : '') + (key === selectedDateKey ? ' active' : '');
        cell.innerHTML = '<span class="d">' + day + '</span>' + (mark ? '<span class="mark">' + mark + '</span>' : '');
        cell.addEventListener('click', (function (k) {
          return function () {
            selectedDateKey = k;
            renderDayPicker();
            hideResult();
            prefetchAvailability(selectedDateKey, totalDuration());
          };
        })(key));
        grid.appendChild(cell);
      }
      monthDiv.appendChild(grid);
      wrap.appendChild(monthDiv);
    });
  }

  function refreshDaySummary() {
    var dur = totalDuration();
    var requestId = ++summaryRequestId;
    var legend = document.getElementById('dayLegend');
    if (dur === 0) {
      daySummary = {};
      legend.style.display = 'none';
      renderDayPicker();
      return;
    }
    prefetchSummary(dur, function (res) {
      if (requestId !== summaryRequestId || dur !== totalDuration()) return;
      daySummary = {};
      (res.days || []).forEach(function (day) { daySummary[day.date] = day.status; });
      legend.style.display = 'flex';
      renderDayPicker();
      prefetchAvailability(selectedDateKey, dur);
    });
  }

  function renderMenuChips() {
    var wrap = document.getElementById('menuChips');
    wrap.innerHTML = '';
    settings.menu.forEach(function (m, idx) {
      var chip = document.createElement('label');
      chip.className = 'chip';
      chip.innerHTML = '<input type="checkbox" data-idx="'+idx+'"><span>'+m.name+'</span><span class="dur">'+m.min+'分</span>';
      wrap.appendChild(chip);
      chip.querySelector('input').addEventListener('change', function (e) {
        var name = settings.menu[idx].name;
        if (e.target.checked) selectedMenu.add(name); else selectedMenu.delete(name);
        chip.classList.toggle('checked', e.target.checked);
        updateDuration();
      });
    });
  }

  function totalDuration() {
    var t = 0;
    settings.menu.forEach(function (m) { if (selectedMenu.has(m.name)) t += m.min; });
    return t;
  }
  function updateDuration() {
    document.getElementById('durationReadout').textContent = fmtDur(totalDuration());
    hideResult();
    refreshDaySummary();
    prefetchAvailability(selectedDateKey, totalDuration());
  }

  function renderRecommend(rec) {
    var card = document.getElementById('recommendCard');
    if (!rec) { card.style.display = 'none'; return; }
    card.style.display = 'flex';
    card.innerHTML = '<div class="recommend-banner"><div class="icon">◎</div>' +
      '<div class="body"><div class="title">前回のご来店より</div><div class="menu">'+rec.sentence+'</div></div></div>';
    rec.matchedMenu.forEach(function (name) {
      var idx = settings.menu.findIndex(function(m){return m.name===name;});
      if (idx === -1) return;
      var input = document.querySelectorAll('#menuChips input')[idx];
      if (input && !input.checked) { input.checked = true; input.dispatchEvent(new Event('change')); }
    });
  }

  function hideResult() {
    document.getElementById('resultSection').style.display = 'none';
    selectedSlot = null;
  }

  function inquiryButtonHtml(label) {
    return '<button class="secondary" id="inquiryBtn" type="button">' + (label || '空き時間を相談する') + '</button>';
  }
  function esc(value) {
    return String(value || '').replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function renderInquiryForm(statusHtml) {
    var section = document.getElementById('resultSection');
    var menuText = Array.from(selectedMenu).join('＋');
    var originalComment = document.getElementById('comment').value.trim();
    section.style.display = 'block';
    section.innerHTML =
      (statusHtml || '<div class="status-hero ok"><div class="mark">◎</div><div class="msg">空き時間をご相談ください</div><div class="sub">表示以外でも調整できる場合があります。こちらからそのままLINEへ送れます。</div></div>') +
      '<label class="field">選択中のメニュー<input type="text" value="'+esc(menuText)+'" readonly></label>' +
      '<label class="field">希望日<input type="text" value="'+esc(selectedDateKey)+'" readonly></label>' +
      '<label class="field">希望時間・時間帯<input type="text" id="inquiryTime" placeholder="例：午前中、16時以降、10時希望"></label>' +
      '<label class="field">お名前<input type="text" id="inquiryName" value="'+esc(lineProfile ? lineProfile.displayName : '')+'" placeholder="お名前"></label>' +
      '<label class="field">お電話番号（任意）<input type="tel" id="inquiryPhone" placeholder="090-1234-5678"></label>' +
      '<label class="field">ご相談内容（任意）<textarea id="inquiryComment" placeholder="別の日でも可能、終了希望時間など">'+esc(originalComment)+'</textarea></label>' +
      '<button class="primary" id="sendInquiryBtn" type="button">LINEに相談内容を送る</button>' +
      '<div class="empty-note" id="inquiryNote" style="display:none;"></div>';
    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('sendInquiryBtn').addEventListener('click', function () {
      var name = document.getElementById('inquiryName').value.trim();
      if (!name) { alert('お名前を入力してください'); return; }
      if (typeof liff === 'undefined' || !liff.isInClient || !liff.isInClient() || !liff.sendMessages) {
        alert('LINEのトーク画面から開いてお送りください。');
        return;
      }
      var btn = this;
      var time = document.getElementById('inquiryTime').value.trim();
      var phone = document.getElementById('inquiryPhone').value.trim();
      var detail = document.getElementById('inquiryComment').value.trim();
      var text = [
        '【空き時間のご相談】',
        'お名前：' + name,
        '希望日：' + selectedDateKey,
        'メニュー：' + menuText,
        '必要時間：' + fmtDur(totalDuration()),
        time ? '希望時間：' + time : '',
        phone ? '電話番号：' + phone : '',
        detail ? '相談内容：' + detail : ''
      ].filter(Boolean).join('\n');
      btn.disabled = true;
      btn.textContent = '送信中…';
      liff.sendMessages([{ type: 'text', text: text }]).then(function () {
        var note = document.getElementById('inquiryNote');
        note.style.display = 'block';
        note.textContent = '相談内容を送信しました。続けてLINEのトークでご相談いただけます。';
        btn.textContent = '送信しました';
        setTimeout(function () { liff.closeWindow(); }, 900);
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'もう一度送る';
        alert('送信できませんでした。もう一度お試しください。');
        debugLog('相談送信エラー: ' + JSON.stringify(err));
      });
    });
  }
  function wireInquiry() {
    var btn = document.getElementById('inquiryBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      renderInquiryForm();
    });
  }

  document.getElementById('checkBtn').addEventListener('click', function () {
    var dur = totalDuration();
    var section = document.getElementById('resultSection');
    if (dur === 0) {
      section.style.display = 'block';
      section.innerHTML = '<div class="empty-note">メニューを選択してください。</div>';
      return;
    }
    section.style.display = 'block';
    var knownStatus = daySummary[selectedDateKey];
    if (knownStatus === 'closed') {
      renderResult({ closed: true, candidates: [] }, dur);
      return;
    }
    if (knownStatus === 'full') {
      renderResult({ closed: false, candidates: [] }, dur);
      return;
    }
    var cached = availabilityCache[availabilityKey(selectedDateKey, dur)];
    if (cached) {
      renderResult(cached, dur);
      return;
    }
    section.innerHTML = '<div class="loading">空き時間を読み込んでいます…</div>';
    prefetchAvailability(selectedDateKey, dur, function (res) {
      renderResult(res, dur);
    });
  });

  function renderResult(res, dur) {
    var section = document.getElementById('resultSection');
    var comment = document.getElementById('comment').value.trim();
    var commentHtml = comment ? '<div class="empty-note" style="background:var(--sunken); border-radius:7px; padding:9px 10px;"><strong style="color:var(--text)">ご要望：</strong>'+comment.replace(/</g,'&lt;')+'</div>' : '';

    if (res.syncUnavailable) {
      renderInquiryForm('<div class="status-hero ng"><div class="mark">…</div><div class="msg">現在、空き状況を確認中です</div><div class="sub">こちらから希望時間をご相談いただけます。</div></div>');
      return;
    }
    if (res.closed) {
      renderInquiryForm('<div class="status-hero ng"><div class="mark">✕</div><div class="msg">この日は定休日です</div><div class="sub">ほかの日程や時間をご相談いただけます。</div></div>');
      return;
    }
    if (res.candidates.length === 0) {
      renderInquiryForm('<div class="status-hero ng"><div class="mark">✕</div><div class="msg">現在表示できる空き枠がありません</div><div class="sub">時間の調整やキャンセル待ちをご案内できる場合があります。下からお気軽にご相談ください。</div></div>');
      return;
    }

    var html = '<div class="status-hero ok"><div class="mark">○</div><div class="msg">ご案内できる時間があります</div>' +
      '<div class="sub">おすすめは <strong class="tabular">'+res.bestStartHHMM+'</strong> です</div></div>' + commentHtml +
      '<div class="eyebrow" style="margin-top:6px;">ご案内可能な時間（タップして選択）</div><div class="slot-grid">';
    res.candidates.forEach(function (c) {
      html += '<div class="slot-btn '+(c.isBest?'best':'')+'" data-start="'+c.start+'" data-end="'+c.endHHMM+'">'+c.startHHMM+(c.isBest?'<span class="tag">おすすめ</span>':'')+'</div>';
    });
    html += '</div>';
    html += '<label class="field" style="margin-top:8px;">お名前（本名でご記入ください）<input type="text" id="custName" value="'+(lineProfile?lineProfile.displayName:'')+'" placeholder="お名前"></label>';
    html += '<label class="field">お電話番号<input type="tel" id="custPhone" placeholder="090-1234-5678"></label>';
    html += '<button class="primary" id="confirmBtn" disabled>時間を選んでください</button>';
    html += '<div class="empty-note" id="submitNote" style="display:none;"></div>';
    html += inquiryButtonHtml('ほかの時間を相談する');
    section.innerHTML = html;
    wireInquiry();

    var duration = dur;
    section.querySelectorAll('.slot-btn').forEach(function (el) {
      el.addEventListener('click', function () {
        section.querySelectorAll('.slot-btn').forEach(function(x){x.classList.remove('selected');});
        el.classList.add('selected');
        selectedSlot = { start: Number(el.dataset.start), endHHMM: el.dataset.end, startHHMM: el.textContent.replace('おすすめ','').trim() };
        var btn = document.getElementById('confirmBtn');
        btn.disabled = false;
        btn.textContent = selectedSlot.startHHMM + ' で予約する';
      });
    });

    document.getElementById('confirmBtn').addEventListener('click', function () {
      if (!selectedSlot) return;
      var nameVal = document.getElementById('custName').value.trim();
      if (!nameVal) {
        alert('お名前を入力してください');
        return;
      }
      var btn = this;
      btn.disabled = true;
      btn.textContent = '送信中…';
      var payload = {
        date: selectedDateKey,
        startMin: selectedSlot.start,
        durationMin: duration,
        menuNames: Array.from(selectedMenu),
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value.trim(),
        lineUserId: lineProfile ? lineProfile.userId : '',
        channel: 'LINE',
        comment: comment
      };
      apiPost(payload, function (r) {
        if (!r.ok) {
          alert(r.message || 'その時間はすでに予約が入っています。空き状況を確認し直してください。');
          document.getElementById('checkBtn').click();
          return;
        }
        btn.textContent = 'リクエスト送信済み';
        finishOfficialChat(payload, r);
      }, function (err) {
        btn.disabled = false;
        btn.textContent = '再送信する';
        alert('送信に失敗しました: ' + err);
      });
    });
  }

  init();
})();
</script>
</body>
</html>
